    <script>
        // BGMは bgm.mp3 のみを再生し、内蔵シンセによる曲生成・切り替え処理は行わない。
        // 効果音のみ、MP3再生失敗時にWeb Audioで代替する。
        // GitHub Pagesではファイル名の大文字・小文字が区別されるため、bgm.mp3 の綴りを一致させる。
        const sounds = {
            bgm: new Audio(new URL('./bgm.mp3', document.baseURI).href),
            hold: new Audio(new URL('./hold.mp3', document.baseURI).href),
            rotate: new Audio(new URL('./rotate.mp3', document.baseURI).href),
            move: new Audio(new URL('./move.mp3', document.baseURI).href),
            line: new Audio(new URL('./Line.mp3', document.baseURI).href),
            button: new Audio(new URL('./button.mp3', document.baseURI).href),
            obstacle: new Audio(new URL('./obstacle.mp3', document.baseURI).href),
            speedup: new Audio(new URL('./speedup.mp3', document.baseURI).href),
            hard: new Audio(new URL('./hard.mp3', document.baseURI).href)
        };

        sounds.bgm.loop = true;
        sounds.bgm.volume = 0.4;
        sounds.bgm.preload = 'auto';

        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioContext = new AudioContextClass();
            }
            if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
            return audioContext;
        }

        function playSynthTone(frequency, startTime, duration, waveform = 'triangle', volume = 0.04) {
            const ac = getAudioContext();
            if (!ac || !Number.isFinite(frequency) || frequency <= 0) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = waveform;
            osc.frequency.setValueAtTime(frequency, startTime);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + Math.max(0.04, duration));
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(startTime);
            osc.stop(startTime + duration + 0.03);
        }

        function playSynthSE(name) {
            const ac = getAudioContext();
            if (!ac) return;
            const now = ac.currentTime + 0.015;
            const tones = {
                button: [660, 0.07], move: [220, 0.045], rotate: [520, 0.09],
                hold: [330, 0.12], line: [880, 0.22], obstacle: [130, 0.18],
                speedup: [740, 0.2], hard: [165, 0.15]
            };
            const [freq, duration] = tones[name] || [440, 0.08];
            const waveform = (name === 'hard' || name === 'obstacle') ? 'sawtooth' : 'square';
            playSynthTone(freq, now, duration, waveform, name === 'move' ? 0.012 : 0.035);
            if (name === 'line' || name === 'speedup') {
                playSynthTone(freq * 1.25, now + 0.09, duration, 'triangle', 0.025);
            }
        }

        function startBgm() {
            sounds.bgm.pause();
            sounds.bgm.currentTime = 0;
            const result = sounds.bgm.play();
            if (result && typeof result.catch === 'function') {
                result.catch(error => {
                    // 自動再生制限やファイル未配置などの原因確認用。BGMは指定のMP3のみを再生する。
                    console.warn('bgm.mp3 を再生できません。ファイルの配置・名前とブラウザの音声設定を確認してください。', error);
                });
            }
        }

        function stopBgm() {
            sounds.bgm.pause();
            sounds.bgm.currentTime = 0;
        }

        function playSE(name) {
            const sound = sounds[name];
            if (!sound) {
                playSynthSE(name);
                return;
            }
            try {
                sound.currentTime = 0;
                const result = sound.play();
                if (result && typeof result.catch === 'function') result.catch(() => playSynthSE(name));
            } catch (e) {
                playSynthSE(name);
            }
        }

        const DEFAULT_CONFIG = {
            targetCounts: [3, 3, 4, 4, 5, 6, 7],
            allowOverlap: false,
            initialSpeedMultiplier: 1.0,
            speedMultiplier: 1.2,
            speedUpIntervalCount: 20,
            garbageIntervalCount: 20,
            garbageRowsCount: 3
        };

        // LocalStorageからの読み込み（設定・ミノ形状）
        let gameConfig = (() => {
            try {
                let saved = localStorage.getItem('neon_tetris_config');
                return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            } catch(e) {
                return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            }
        })();

        let customMinos = (() => {
            try {
                let saved = localStorage.getItem('neon_tetris_minos');
                return saved ? JSON.parse(saved) : Array.from({ length: 7 }, () => Array.from({ length: 4 }, () => Array(4).fill(0)));
            } catch(e) {
                return Array.from({ length: 7 }, () => Array.from({ length: 4 }, () => Array(4).fill(0)));
            }
        })();

        function saveConfigToStorage() {
            try { localStorage.setItem('neon_tetris_config', JSON.stringify(gameConfig)); } catch(e) {}
        }

        function saveMinosToStorage() {
            try { localStorage.setItem('neon_tetris_minos', JSON.stringify(customMinos)); } catch(e) {}
        }

        const MINO_COLORS = ['#06b6d4', '#ec4899', '#facc15', '#10b981', '#f97316', '#3b82f6', '#a855f7'];

        let isDrawing = false;
        let drawTargetState = 1;
        let allValid = false;
        let editorCells = [];

        const editorContainer = document.getElementById('minos-editor-container');
        const startGameBtn = document.getElementById('start-game-btn');
        const validationDetails = document.getElementById('validation-details');

        // 設定モーダル関連

        document.getElementById('save-settings-btn').onclick = () => {

        };

        document.getElementById('reset-settings-btn').onclick = () => {
            gameConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

        // ミノリセットボタン
        document.getElementById('reset-minos-btn').onclick = () => {
            if (confirm('描いたミノをすべてリセットしてまっさらにしますか？')) {
                customMinos = Array.from({ length: 7 }, () => Array.from({ length: 4 }, () => Array(4).fill(0)));
                saveMinosToStorage();
                initEditor();

        function syncSettingsToUI() {

            document.getElementById('setting-garbage-count').value = gameConfig.garbageIntervalCount;
            document.getElementById('setting-garbage-rows').value = gameConfig.garbageRowsCount;

            const targetsDiv = document.getElementById('settings-target-counts');
            targetsDiv.innerHTML = '';

                    </div>

        function syncUIToSettings() {
            gameConfig.allowOverlap = document.getElementById('setting-allow-overlap').checked;
            gameConfig.initialSpeedMultiplier = parseFloat(document.getElementById('setting-initial-speed').value) || 1.0;
            gameConfig.speedMultiplier = parseFloat(document.getElementById('setting-speed-mult').value) || 1.2;

        function initEditor() {
            editorContainer.innerHTML = '';
            editorCells = Array.from({ length: 7 }, () => Array.from({ length: 4 }, () => Array(4)));
            for (let i = 0; i < 7; i++) {
                const card = document.createElement('div');
                card.className = 'bg-slate-900/90 border border-slate-800 rounded-xl p-2.5 flex flex-col items-center shadow-md';
                
                const header = document.createElement('div');
                header.className = 'w-full flex justify-between items-center mb-1.5';
                header.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <div class="w-4 h-4 rounded-full border border-white/40 shadow" style="background-color: ${MINO_COLORS[i]};"></div>
                        <span class="cyber-font text-xs font-bold text-cyan-400">MINO #${i+1}</span>
                    </div>
                    <span id="count-badge-${i}" class="text-[9px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-bold">目標: ${gameConfig.targetCounts[i]}マス</span>
                `;
                card.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'mino-grid grid grid-cols-4 gap-1 p-1 bg-slate-950 rounded-lg border border-slate-800';
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const cell = document.createElement('div');
                        const isActive = customMinos[i][r][c];
                        cell.className = 'w-7 h-7 sm:w-8 sm:h-8 rounded transition-all duration-150 cursor-pointer flex items-center justify-center border ' + 
                            (isActive ? 'shadow-md scale-95' : 'bg-slate-900 hover:bg-slate-800 border-slate-800/60');
                        
                        if (isActive) {
                            cell.style.backgroundColor = MINO_COLORS[i];
                            cell.style.borderColor = '#ffffff';
                            cell.style.boxShadow = `0 0 8px ${MINO_COLORS[i]}`;
                        } else {
                            cell.style.backgroundColor = '#0f172a';
                        }
                        
                        editorCells[i][r][c] = cell;
                        const paintCell = (active) => {
                            cell.className = 'w-7 h-7 sm:w-8 sm:h-8 rounded cursor-pointer flex items-center justify-center border ' +
                                (active ? 'shadow-md scale-95' : 'bg-slate-900 border-slate-800/60');
                            cell.style.backgroundColor = active ? MINO_COLORS[i] : '#0f172a';
                            cell.style.borderColor = active ? '#ffffff' : '';
                            cell.style.boxShadow = active ? `0 0 5px ${MINO_COLORS[i]}` : '';
                        };
                        cell.onpointerdown = (e) => {
                            e.preventDefault();
                            isDrawing = true;
                            drawTargetState = customMinos[i][r][c] ? 0 : 1;
                            customMinos[i][r][c] = drawTargetState;
                            paintCell(!!drawTargetState);
                            validateAllMinos();
                        };
                        cell.onpointerenter = () => {
                            if (isDrawing && customMinos[i][r][c] !== drawTargetState) {
                                customMinos[i][r][c] = drawTargetState;
                                paintCell(!!drawTargetState);
                                validateAllMinos();
                            }
                        };
                        grid.appendChild(cell);
                    }
                }
                card.appendChild(grid);

                const errDiv = document.createElement('div');
                errDiv.id = `error-msg-${i}`;
                errDiv.className = 'text-[9px] text-pink-400 mt-1 h-3.5 text-center truncate w-full';
                card.appendChild(errDiv);

                editorContainer.appendChild(card);
            }
            validateAllMinos();
        }

        window.addEventListener('pointerup', () => {
            if (isDrawing) {
                isDrawing = false;
                saveMinosToStorage();

        window.addEventListener('pointercancel', () => {

            }

        // ゲーム中のブラウザ標準スクロール・ピンチ操作を抑止
        document.addEventListener('touchmove', (e) => {

                !document.getElementById('settings-modal').classList.contains('hidden')) {
                if (!e.target.closest('#settings-modal .overflow-y-auto')) e.preventDefault();

        }, { passive: false });
        document.addEventListener('gesturestart', (e) => {
            if (!document.getElementById('game-screen').classList.contains('hidden')) e.preventDefault();
        }, { passive: false });

        function getCanonicalSignature(matrix) {
            let coords = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (matrix[r][c]) coords.push({r, c});
                }
            }
            if (coords.length === 0) return "";

            let canonicalStr = null;
            let currentMat = matrix.map(row => [...row]);
            
            for (let rot = 0; rot < 4; rot++) {
                let minR = 4, maxR = -1, minC = 4, maxC = -1;
                let rotatedCoords = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (currentMat[r][c]) {
                            rotatedCoords.push({r, c});
                            if (r < minR) minR = r;
                            if (r > maxR) maxR = r;
                            if (c < minC) minC = c;
                            if (c > maxC) maxC = c;
                        }
                    }
                }

                let normalized = rotatedCoords.map(pt => `${pt.r - minR},${pt.c - minC}`);
                normalized.sort();
                let sig = normalized.join(';');

                if (canonicalStr === null || sig < canonicalStr) {
                    canonicalStr = sig;
                }

                let nextMat = Array.from({ length: 4 }, () => Array(4).fill(0));
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (currentMat[r][c]) {
                            nextMat[c][3 - r] = 1;
                        }
                    }
                }
                currentMat = nextMat;
            }
            return canonicalStr;
        }

        function checkConnectivity(matrix) {
            let coords = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (matrix[r][c]) coords.push({r, c});
                }
            }
            if (coords.length === 0) return false;

            let visited = Array.from({ length: 4 }, () => Array(4).fill(false));
            let queue = [coords[0]];
            visited[coords[0].r][coords[0].c] = true;
            let count = 0;

            while (queue.length > 0) {
                let {r, c} = queue.shift();
                count++;
                const dirs = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];
                for (let d of dirs) {
                    let nr = r + d.r, nc = c + d.c;
                    if (nr >= 0 && nr < 4 && nc >= 0 && nc < 4 && matrix[nr][nc] && !visited[nr][nc]) {
                        visited[nr][nc] = true;
                        queue.push({r: nr, c: nc});
                    }
                }
            }
            return count === coords.length;
        }

        function validateAllMinos() {
            let signatures = new Set();
            allValid = true;

            for (let i = 0; i < 7; i++) {
                let count = 0;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (customMinos[i][r][c]) count++;
                    }
                }

                let msg = "";
                let isValid = true;
                const targetCount = gameConfig.targetCounts[i];

                if (count !== targetCount) {
                    msg = `要${targetCount}マス (現在${count})`;
                    isValid = false;
                } else if (!checkConnectivity(customMinos[i])) {
                    msg = `ブロックが分断されています`;
                    isValid = false;
                } else if (!gameConfig.allowOverlap) {
                    let sig = getCanonicalSignature(customMinos[i]);
                    if (signatures.has(sig)) {
                        msg = `他のミノと形状が重複`;
                        isValid = false;
                    } else {
                        signatures.add(sig);
                    }
                }

                document.getElementById(`error-msg-${i}`).innerText = msg;
                const badge = document.getElementById(`count-badge-${i}`);
                if (isValid) {
                    badge.className = "text-[9px] px-2 py-0.5 rounded-full bg-emerald-950 border border-emerald-500/50 text-emerald-400 font-bold";
                } else {
                    badge.className = "text-[9px] px-2 py-0.5 rounded-full bg-pink-950 border border-pink-500/50 text-pink-400 font-bold";
                }

                if (!isValid) allValid = false;
            }

            if (allValid) {
                validationDetails.innerHTML = `<span class="text-emerald-400 font-bold">✓ すべての条件をクリアしました！</span>`;
                startGameBtn.disabled = false;
                startGameBtn.className = "w-full py-3 px-6 rounded-xl cyber-font font-bold text-sm tracking-wider uppercase transition-all duration-300 bg-cyan-600 hover:bg-cyan-500 text-white shadow-lg neon-glow-cyan cursor-pointer";
            } else {
                validationDetails.innerHTML = `<span class="text-pink-400">✗ 指定されたマス数・連結・重複ルールを満たしてください。</span>`;
                startGameBtn.disabled = true;
                startGameBtn.className = "w-full py-3 px-6 rounded-xl cyber-font font-bold text-sm tracking-wider uppercase transition-all duration-300 bg-slate-800 text-slate-500 cursor-not-allowed shadow-lg";
            }
        }

        initEditor();

        let gameStarted = false;
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        let board = Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(0));

        let currentPiece = null;
        let currentX = 3;
        let currentY = 0;
        let currentMinoIndex = 0;
        let holdPieceIndex = null;
        let canHold = true;

        let bag = [];
        let nextQueue = []; 

        let score = 0;
        let placedCount = 0;
        let clearedLinesTotal = 0;
        let clearedLinesScoreTotal = 0;
        let dropInterval = 1000;
        let dropTimer = null;
        let isAnimatingClear = false;
        let isStagingGarbage = false;

        let isLockDelaying = false;
        let lockDelayTimeout = null;
        const LOCK_DELAY_TIME = 1000;

        startGameBtn.onclick = () => {
            if (!allValid) return;
            playSE('button');
            document.getElementById('editor-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            initGame();
        };

        function initGame() {
            gameStarted = true;
            board = Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(0));
            score = 0;
            placedCount = 0;
            clearedLinesTotal = 0;
            clearedLinesScoreTotal = 0;
            dropInterval = 1000 / gameConfig.initialSpeedMultiplier;
            holdPieceIndex = null;
            canHold = true;
            isAnimatingClear = false;
            isStagingGarbage = false;
            clearLockDelay();

            // Use bgm.mp3 directly; calling this during the start-button click
            // keeps mobile-browser autoplay restrictions satisfied.
            startBgm();

            refillBag();
            nextQueue = [];
            for (let i = 0; i < 6; i++) {
                nextQueue.push(pullBag());
            }
            spawnPiece();
            updateUIStats();
            startDropTimer();
            drawGame();
        }

        function refillBag() {
            bag = [0, 1, 2, 3, 4, 5, 6];
            for (let i = bag.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
        }

        function pullBag() {
            if (bag.length === 0) refillBag();
            return bag.pop();
        }

        function spawnPiece() {
            clearLockDelay();
            currentMinoIndex = nextQueue.shift();
            nextQueue.push(pullBag());
            currentPiece = customMinos[currentMinoIndex].map(row => [...row]);
            currentX = Math.floor((BOARD_WIDTH - 4) / 2);
            currentY = 0;
            canHold = true;
            drawMiniPreviews();

            if (checkCollision(currentX, currentY, currentPiece)) {
                gameOver();
            }
        }

        function checkCollision(nx, ny, piece) {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (piece[r][c]) {
                        let boardX = nx + c;
                        let boardY = ny + r;
                        if (boardX < 0 || boardX >= BOARD_WIDTH || boardY >= BOARD_HEIGHT) {
                            return true;
                        }
                        if (boardY >= 0 && board[boardY][boardX] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function rotatePiece(piece, direction) {
            let newPiece = Array.from({ length: 4 }, () => Array(4).fill(0));
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (piece[r][c]) {
                        if (direction === 'right') {
                            newPiece[c][3 - r] = 1;
                        } else {
                            newPiece[3 - c][r] = 1;
                        }
                    }
                }
            }
            return newPiece;
        }

        function clearLockDelay() {
            if (lockDelayTimeout) {
                clearTimeout(lockDelayTimeout);
                lockDelayTimeout = null;
            }
            isLockDelaying = false;
        }

        function triggerLockDelay() {
            if (isLockDelaying) return;
            isLockDelaying = true;
            lockDelayTimeout = setTimeout(() => {
                if (gameStarted && !isAnimatingClear && !isStagingGarbage) {
                    lockPiece();
                }
            }, LOCK_DELAY_TIME);
        }

        function resetLockDelayIfGrounded() {
            if (checkCollision(currentX, currentY + 1, currentPiece)) {
                clearLockDelay();
                triggerLockDelay();
            }
        }

        function tryRotate(direction) {
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            let rotated = rotatePiece(currentPiece, direction);
            let kicks = [{x:0, y:0}, {x:-1, y:0}, {x:1, y:0}, {x:0, y:-1}, {x:-2, y:0}, {x:2, y:0}];
            for (let k of kicks) {
                if (!checkCollision(currentX + k.x, currentY + k.y, rotated)) {
                    currentX += k.x;
                    currentY += k.y;
                    currentPiece = rotated;
                    playSE('rotate');
                    resetLockDelayIfGrounded();
                    drawGame();
                    return;
                }
            }
        }

        function moveLeft() {
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            if (!checkCollision(currentX - 1, currentY, currentPiece)) {
                currentX--;
                playSE('move');
                resetLockDelayIfGrounded();
                drawGame();
            }
        }

        function moveRight() {
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            if (!checkCollision(currentX + 1, currentY, currentPiece)) {
                currentX++;
                playSE('move');
                resetLockDelayIfGrounded();
                drawGame();
            }
        }

        function autoOrSoftDrop(isSoft) {
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            if (!checkCollision(currentX, currentY + 1, currentPiece)) {
                currentY++;
                if (isSoft) {
                    score += 1;
                    playSE('move');
                }
                if (!checkCollision(currentX, currentY + 1, currentPiece)) {
                    clearLockDelay();
                } else {
                    triggerLockDelay();
                }
                drawGame();
            } else {
                triggerLockDelay();
            }
        }

        function hardDrop() {
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            clearLockDelay();
            let dropDist = 0;
            while (!checkCollision(currentX, currentY + 1, currentPiece)) {
                currentY++;
                dropDist++;
            }
            score += dropDist * 2;
            playSE('hard');
            lockPiece();
        }

        function holdPieceFunc() {
            if (!gameStarted || !canHold || isAnimatingClear || isStagingGarbage) return;
            clearLockDelay();
            playSE('hold');
            if (holdPieceIndex === null) {
                holdPieceIndex = currentMinoIndex;
                spawnPiece();
            } else {
                let temp = holdPieceIndex;
                holdPieceIndex = currentMinoIndex;
                currentMinoIndex = temp;
                currentPiece = customMinos[currentMinoIndex].map(row => [...row]);
                currentX = Math.floor((BOARD_WIDTH - 4) / 2);
                currentY = 0;
                drawMiniPreviews();
            }
            canHold = false;
            drawGame();
        }

        function lockPiece() {
            if (!gameStarted) return;
            clearLockDelay();

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (currentPiece[r][c]) {
                        let bx = currentX + c;
                        let by = currentY + r;
                        if (by >= 0 && by < BOARD_HEIGHT && bx >= 0 && bx < BOARD_WIDTH) {
                            board[by][bx] = currentMinoIndex + 1;
                        }
                    }
                }
            }

            placedCount++;

            let fullRows = [];
            for (let r = 0; r < BOARD_HEIGHT; r++) {
                if (board[r].every(cell => cell !== 0)) {
                    fullRows.push(r);
                }
            }

            if (fullRows.length > 0) {
                isAnimatingClear = true;
                playSE('line');
                drawGameWithFlash(fullRows, () => {
                    for (let r of fullRows) {
                        board.splice(r, 1);
                        board.unshift(Array(BOARD_WIDTH).fill(0));
                    }
                    clearedLinesTotal += fullRows.length;
                    clearedLinesScoreTotal += fullRows.length * 200;
                    finalizeLockSequence();
                });
            } else {
                finalizeLockSequence();
            }
        }

        function finalizeLockSequence() {
            if (!gameStarted) return;
            isAnimatingClear = false; // ★ここで確実にフラグをリセット
            score = (placedCount * 50) + clearedLinesScoreTotal;
            updateUIStats();

            let shouldSpeedUp = placedCount > 0 && placedCount % gameConfig.speedUpIntervalCount === 0;
            let shouldGarbage = placedCount > 0 && placedCount % gameConfig.garbageIntervalCount === 0;

            if (shouldSpeedUp) {
                dropInterval = Math.max(50, dropInterval / gameConfig.speedMultiplier);
                restartDropTimer();

                playSE('speedup');
                const cutin = document.getElementById('speedup-cutin');
                document.getElementById('speedup-sub').innerText = `VELOCITY ${(1000/dropInterval).toFixed(1)}x`;
                cutin.classList.remove('hidden');

                setTimeout(() => {
                    cutin.classList.add('hidden');
                    if (!gameStarted) return;
                    if (shouldGarbage) {
                        triggerGarbageRows();
                    } else {
                        isAnimatingClear = false;
                        isStagingGarbage = false;
                        spawnPiece();
                        drawGame();
                    }
                }, 900);
            } else if (shouldGarbage) {
                triggerGarbageRows();
            } else {
                isAnimatingClear = false;
                isStagingGarbage = false;
                spawnPiece();
                drawGame();
            }
        }

        function triggerGarbageRows() {
            isStagingGarbage = true;
            playSE('obstacle');
            let numRows = gameConfig.garbageRowsCount;
            let holeCol = Math.floor(Math.random() * BOARD_WIDTH);

            for (let i = 0; i < numRows; i++) {
                if (board[0].some(cell => cell !== 0)) {
                    gameOver();
                    return;
                }
                board.shift();
                let garbageRow = Array(BOARD_WIDTH).fill(8);
                garbageRow[holeCol] = 0;
                board.push(garbageRow);
            }

            drawGame();
            setTimeout(() => {
                if (!gameStarted) return;
                isStagingGarbage = false;
                spawnPiece();
                drawGame();
            }, 300);
        }

        function startDropTimer() {
            if (dropTimer) clearInterval(dropTimer);
            dropTimer = setInterval(() => {
                if (gameStarted && !isAnimatingClear && !isStagingGarbage) {
                    autoOrSoftDrop(false);
                }
            }, dropInterval);
        }

        function restartDropTimer() {
            startDropTimer();
        }

        function gameOver() {
            gameStarted = false;
            isAnimatingClear = false;
            isStagingGarbage = false;
            clearLockDelay();
            if (dropTimer) clearInterval(dropTimer);
            if (softDropInterval) clearInterval(softDropInterval);
            if (kbSoftDropInterval) clearInterval(kbSoftDropInterval);

            stopBgm();
            document.getElementById('game-controls').classList.add('hidden');

            document.getElementById('res-placed').innerText = placedCount;
            document.getElementById('res-p-score').innerText = placedCount * 50;
            document.getElementById('res-l-score').innerText = clearedLinesScoreTotal;
            document.getElementById('res-total').innerText = score;
            document.getElementById('game-over-overlay').classList.remove('hidden');
        }

        function updateUIStats() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('placed-val').innerText = placedCount;
            document.getElementById('lines-val').innerText = clearedLinesTotal;
            document.getElementById('speed-val').innerText = (1000 / dropInterval).toFixed(1) + 'x';
            let nextGarbage = gameConfig.garbageIntervalCount - (placedCount % gameConfig.garbageIntervalCount);
            document.getElementById('obstacle-countdown').innerText = nextGarbage;
        }

        const canvas = document.getElementById('tetris-canvas');
        // 盤面は毎回全面を塗るため alpha:false にして合成コストを抑える。
        const ctx = canvas.getContext('2d', { alpha: false });
        const holdCanvas = document.getElementById('hold-canvas');
        const holdCtx = holdCanvas.getContext('2d');
        const nextContexts = Array.from({ length: 6 }, (_, i) =>
            document.getElementById(`next-canvas-${i}`).getContext('2d')
        );
        const BLOCK_SIZE = 18;

        // 静的な背景・グリッドは最初に一度だけ描き、ゲーム中は drawImage で再利用する。
        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = canvas.width;
        gridCanvas.height = canvas.height;
        const gridCtx = gridCanvas.getContext('2d', { alpha: false });
        gridCtx.fillStyle = '#030712';
        gridCtx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);
        gridCtx.strokeStyle = '#0f172a';
        gridCtx.lineWidth = 0.5;
        for (let r = 0; r < BOARD_HEIGHT; r++) {
            for (let c = 0; c < BOARD_WIDTH; c++) {
                gridCtx.strokeRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            }
        }

        function drawGame() {
            // 背景とグリッドの再描画を省き、変化するブロックだけを重ねて描く。
            ctx.drawImage(gridCanvas, 0, 0);

            for (let r = 0; r < BOARD_HEIGHT; r++) {
                for (let c = 0; c < BOARD_WIDTH; c++) {
                    if (board[r][c]) {
                        let id = board[r][c];
                        if (id === 8) {
                            ctx.fillStyle = '#64748b';
                        } else {
                            ctx.fillStyle = MINO_COLORS[id - 1];
                        }
                        ctx.fillRect(c * BLOCK_SIZE + 1, r * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                    }
                }
            }

            if (!gameStarted || !currentPiece || isAnimatingClear) {
                return;
            }

            let ghostY = currentY;
            while (!checkCollision(currentX, ghostY + 1, currentPiece)) {
                ghostY++;
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (currentPiece[r][c]) {
                        let bx = currentX + c;
                        let by = ghostY + r;
                        if (by >= 0) {
                            ctx.fillRect(bx * BLOCK_SIZE + 1, by * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        }
                    }
                }
            }

            ctx.fillStyle = MINO_COLORS[currentMinoIndex];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (currentPiece[r][c]) {
                        let bx = currentX + c;
                        let by = currentY + r;
                        if (by >= 0) {
                            ctx.fillRect(bx * BLOCK_SIZE + 1, by * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        }
                    }
                }
            }

        }

        function drawGameWithFlash(fullRows, callback) {
            drawGame();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            for (let r of fullRows) {
                ctx.fillRect(0, r * BLOCK_SIZE, BOARD_WIDTH * BLOCK_SIZE, BLOCK_SIZE);
            }
            setTimeout(() => {
                callback();
            }, 220);
        }

        function drawMiniPreviews() {
            drawMiniPreview(holdCtx, holdPieceIndex, 50);
            for (let i = 0; i < 6; i++) {
                drawMiniPreview(nextContexts[i], nextQueue[i], 44);
            }
        }

        function drawMiniPreview(targetCtx, minoIdx, sizePx) {
            targetCtx.fillStyle = '#030712';
            targetCtx.fillRect(0, 0, sizePx, sizePx);

            if (minoIdx === null || minoIdx === undefined) return;

            let piece = customMinos[minoIdx];
            let cellSize = sizePx === 50 ? 10 : 9;
            
            let minR = 4, maxR = -1, minC = 4, maxC = -1;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (piece[r][c]) {
                        if (r < minR) minR = r;
                        if (r > maxR) maxR = r;
                        if (c < minC) minC = c;
                        if (c > maxC) maxC = c;
                    }
                }
            }
            let w = (maxC - minC + 1) * cellSize;
            let h = (maxR - minR + 1) * cellSize;
            let offsetX = (sizePx - w) / 2 - minC * cellSize;
            let offsetY = (sizePx - h) / 2 - minR * cellSize;

            targetCtx.fillStyle = MINO_COLORS[minoIdx];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (piece[r][c]) {
                        targetCtx.fillRect(c * cellSize + offsetX, r * cellSize + offsetY, cellSize - 1, cellSize - 1);
                    }
                }
            }
        }

        document.getElementById('btn-left').onclick = moveLeft;
        document.getElementById('btn-right').onclick = moveRight;
        document.getElementById('btn-rot-left').onclick = () => tryRotate('left');
        document.getElementById('btn-rot-right').onclick = () => tryRotate('right');
        document.getElementById('btn-hard-drop').onclick = hardDrop;
        document.getElementById('btn-hold').onclick = holdPieceFunc;

        let softDropInterval = null;
        const softDropBtn = document.getElementById('btn-soft-drop');

        softDropBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            autoOrSoftDrop(true);
            if (!softDropInterval) {
                softDropInterval = setInterval(() => {
                    if (!gameStarted || isAnimatingClear || isStagingGarbage) {
                        clearInterval(softDropInterval);
                        softDropInterval = null;
                        return;
                    }
                    autoOrSoftDrop(true);
                }, 70);
            }
        });

        const stopSoftDrop = () => {
            if (softDropInterval) {
                clearInterval(softDropInterval);
                softDropInterval = null;
            }
        };
        softDropBtn.addEventListener('pointerup', stopSoftDrop);
        softDropBtn.addEventListener('pointerleave', stopSoftDrop);
        softDropBtn.addEventListener('pointercancel', stopSoftDrop);

        let kbSoftDropInterval = null;
        window.addEventListener('keydown', (e) => {
            if (!gameStarted || isAnimatingClear || isStagingGarbage) return;
            if (e.key === 'ArrowLeft') moveLeft();
            else if (e.key === 'ArrowRight') moveRight();
            else if (e.key === 'ArrowDown') {
                if (!kbSoftDropInterval) {
                    autoOrSoftDrop(true);
                    kbSoftDropInterval = setInterval(() => {
                        if (!gameStarted || isAnimatingClear || isStagingGarbage) {
                            clearInterval(kbSoftDropInterval);
                            kbSoftDropInterval = null;
                            return;
                        }
                        autoOrSoftDrop(true);
                    }, 70);
                }
            }
            else if (e.key === 'ArrowUp') hardDrop();
            else if (e.key === 'z' || e.key === 'Z') tryRotate('left');
            else if (e.key === 'x' || e.key === 'X') tryRotate('right');
            else if (e.key === 'c' || e.key === 'C' || e.key === 'Shift') holdPieceFunc();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowDown' && kbSoftDropInterval) {
                clearInterval(kbSoftDropInterval);
                kbSoftDropInterval = null;
            }
        });
    </script>
</body>
</html>
